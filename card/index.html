    if ('serviceWorker' in navigator) {

    (() => {
      'use strict';
      const trigger=document.getElementById('tools-trigger');
      const sheet=document.getElementById('more-actions');
      const toast=document.getElementById('toast');
      let toastTimer=0;
      function notify(message){ clearTimeout(toastTimer); toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2500); }
      trigger.addEventListener('click',()=>{ if(typeof sheet.showModal==='function'){sheet.showModal();} else {sheet.setAttribute('open','');} });
      document.getElementById('close-actions').addEventListener('click',()=>sheet.close());
      sheet.addEventListener('click',(event)=>{if(event.target===sheet)sheet.close();});
      document.getElementById('share').addEventListener('click',async()=>{
        const data={title:'Igor Lacrose | Lacrose Tecnologia',text:'Sua empresa tem um problema? Nós desenvolvemos a solução.',url:'https://lacrosetecnologia.com.br/card/'};
        try {if(navigator.share){await navigator.share(data);return;}}catch(e){ if(e && e.name==='AbortError')return; }
        try {await navigator.clipboard.writeText(data.url);notify('Link do cartão copiado.');}
        catch(e){notify('Compartilhe: '+data.url);}
      });

`;

        const href=URL.createObjectURL(new Blob([v],{type:'text/vcard;charset=utf-8'}));

      });
    })();
