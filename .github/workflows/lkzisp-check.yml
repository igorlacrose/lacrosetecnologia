name: LKZ ISP Portal Seguro

on:
  pull_request:
    paths:
      - 'lkzisp/**'
      - '.github/workflows/lkzisp-check.yml'
  push:
    paths:
      - 'lkzisp/**'
      - '.github/workflows/lkzisp-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    name: Auditoria statica e teste de acesso anonimo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Testes locais
        run: |
          node --check lkzisp/portal.js
          node --test lkzisp/tests/portal.test.mjs
      - name: Backend nao exposto sem login
        run: |
          node --input-type=module -e '
            const r=await fetch("https://syysqoieyycclpfbadwp.supabase.co/functions/v1/lkzisp-owner-bootstrap",{signal:AbortSignal.timeout(12000)});
            if(![401,403].includes(r.status))throw Error("Owner bootstrap allowed anonymous: "+r.status);
            console.log("Bootstrap denied anonymous HTTP "+r.status);
          '
