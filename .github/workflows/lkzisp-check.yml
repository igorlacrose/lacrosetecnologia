name: LKZ ISP Plataforma Gerencial

on:
  pull_request:
    paths:
      - 'lkzisp/**'
      - '.github/workflows/lkzisp-check.yml'
  push:
    paths:
      - 'lkzisp/**'
      - '.github/workflows/lkzisp-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plataforma:
    name: Testes da plataforma, cloud e MFA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: JavaScript e testes da plataforma
        run: |
          node --check lkzisp/src/app.js
          node --check lkzisp/src/cloud-auth.js
          node --check lkzisp/sw.js
          node --test lkzisp/tests/*.test.js
      - name: Bloqueio de acesso anonimo ao MASTER
        run: |
          node --input-type=module -e '
            const r=await fetch("https://syysqoieyycclpfbadwp.supabase.co/functions/v1/lkzisp-owner-bootstrap",{signal:AbortSignal.timeout(12000)});
            if(![401,403].includes(r.status))throw Error("Owner bootstrap allowed anonymous: "+r.status);
            console.log("Bootstrap denied anonymous HTTP "+r.status);
          '
      - name: Conferencia do pacote estatico
        run: |
          node --input-type=module -e '
            import {readFileSync,existsSync} from "node:fs";
            const html=readFileSync("lkzisp/index.html","utf8");
            if(!html.includes("src/app.js") || !html.includes("LKZ ISP Intelligence"))throw Error("Dashboard not configured");
            for(const p of ["lkzisp/assets/jszip.min.js","lkzisp/src/engine.js","lkzisp/src/importer.js","lkzisp/src/quality.js","lkzisp/manifest.webmanifest"]) if(!existsSync(p))throw Error("Missing "+p);
            console.log("Portal replaced by full dashboard package");
          '
