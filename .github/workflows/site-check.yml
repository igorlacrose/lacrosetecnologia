name: Site Production Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validar arquivos, links e SEO
        run: python scripts/site_check.py

      - name: Validar sintaxe do LKZ ADM
        run: node --check admin/app.js

      - name: Testar MFA e limite de inatividade
        run: node --test scripts/test_admin_idle_mfa.mjs scripts/test_admin_live_refresh.mjs

      - name: Validar sintaxe e respostas do assistente OCA
        run: |
          node --check app.js
          node --check assets/oca-intents.js
          node --check assets/oca-advisor.js
          node --test scripts/test_oca_advisor.cjs scripts/test_oca_intents.cjs

      - name: Validar conhecimento supervisionado e limites de IA
        run: |
          node --check assets/oca-knowledge.js
          node --test scripts/test_oca_supervised.cjs

      - name: Testar Turnstile e bloqueios de chamadas pagas
        run: |
          node --check assets/oca-turnstile.js
          node --test scripts/test_oca_turnstile.cjs

      - name: Testar fundacao isolada do LKZ ADM VNext
        working-directory: vnext
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test

      - name: Verificar segredos no histórico Git
        run: python scripts/secret_history_check.py

      - name: Validar RLS em PostgreSQL nativo
        working-directory: vnext
        run: |
          pg_bin="$(pg_config --bindir)"
          pg_data="$(mktemp -d)"
          pg_password="$(openssl rand -hex 32)"
          printf '%s\n' "$pg_password" | "$pg_bin/initdb" -D "$pg_data" -U lkz_native_test_bootstrap \
            --auth-local=reject --auth-host=scram-sha-256 --pwfile=/dev/stdin --no-locale -E UTF8
          trap '"$pg_bin/pg_ctl" -D "$pg_data" -m fast -w stop' EXIT
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$pg_data/server.log" \
            -o "-h 127.0.0.1 -p 55437 -c log_min_error_statement=panic" -w start
          export VNEXT_NATIVE_TEST_ADMIN_URL="postgresql://lkz_native_test_bootstrap:$pg_password@127.0.0.1:55437/postgres"
          node --test test/staging-native.test.mjs
