name: Site Production Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validar arquivos, links e SEO
        run: python scripts/site_check.py

      - name: Validar sintaxe do LKZ ADM
        run: node --check admin/app.js

      - name: Testar MFA e limite de inatividade
        run: node --test scripts/test_admin_idle_mfa.mjs scripts/test_admin_live_refresh.mjs

      - name: Revisar segurança da migração de mensagens
        run: node --test scripts/test_admin_message_migration.mjs

      - name: Validar sintaxe e respostas do assistente OCA
        run: |
          node --check app.js
          node --check assets/oca-intents.js
          node --check assets/oca-advisor.js
          node --test scripts/test_oca_advisor.cjs scripts/test_oca_intents.cjs

      - name: Validar conhecimento supervisionado e limites de IA
        run: |
          node --check assets/oca-knowledge.js
          node --test scripts/test_oca_supervised.cjs

      - name: Testar Turnstile e bloqueios de chamadas pagas
        run: |
          node --check assets/oca-turnstile.js
          node --test scripts/test_oca_turnstile.cjs

      - name: Testar regressões do LKZ ADM
        run: node scripts/lkz_adm_regression_check.cjs

      - name: Testar paginação e triagem interna do LKZ ADM
        run: node scripts/test_lkz_adm_scaling.cjs

      - name: Testar respostas manuais do CRM
        run: |
          node --check admin/crm-comms.js
          node --test scripts/test_lkz_crm_comms.mjs

      - name: Testar revisão de pré-envio do CRM
        run: |
          node --check admin/crm-previews.js
          node --test scripts/test_lkz_crm_previews.mjs

      - name: Testar autorizações e revogações por canal
        run: |
          node --check admin/contact-consent.js
          node --test scripts/test_lkz_contact_consents.mjs

      - name: Testar pré-despacho seguro do OCA
        run: |
          node --check admin/oca-dispatch-preflight.js
          node --test scripts/test_oca_dispatch_preflight.mjs

      - name: Testar catálogo e minutas comerciais
        run: |
          node --check admin/client-services.js
          node --test scripts/test_lkz_client_services.mjs

      - name: Testar propostas comerciais versionadas
        run: |
          node --check admin/client-quotes.js
          node --test scripts/test_lkz_client_quotes.mjs

      - name: Testar dossiês contratuais sem assinatura
        run: |
          node --check admin/client-signature-dossiers.js
          node --test scripts/test_lkz_signature_dossiers.mjs

      - name: Testar minutas contratuais privadas
        run: |
          node --check admin/client-contract-texts.js
          node --test scripts/test_lkz_contract_texts.mjs

      - name: Verificar segredos no histórico Git
        run: python scripts/secret_history_check.py

  contract-document-exclusivity:
    name: Documento único por proposta (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container: postgres:17.11

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: lkz_contract_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-pg17-ci-only
        options: >-
          --health-cmd="pg_isready -U postgres -d lkz_contract_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Testar migração real e concorrência de documentos
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGDATABASE: lkz_contract_test
          PGPASSWORD: ephemeral-pg17-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/test_lkz_document_exclusivity_pg17.sql
          bash scripts/test_lkz_document_exclusivity_race.sh
