name: VNext PostgreSQL 17 Staging Smoke

on:
  pull_request:
    paths:
      - "vnext/**"
      - ".github/workflows/vnext-postgres17-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-isolated:
    name: PostgreSQL 17 · migrações e RLS descartáveis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only-not-a-secret
          POSTGRES_DB: lkz_vnext_stage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lkz_vnext_stage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout isolado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Instalar dependências fixadas (scripts desativados)
        working-directory: vnext
        run: npm ci --ignore-scripts
      - name: Migrar duas vezes, simular quota e testar acesso negado
        working-directory: vnext
        env:
          CI_PG17_TEST_URL: postgresql://postgres:ci-local-only-not-a-secret@127.0.0.1:5432/lkz_vnext_stage_ci
        run: node --test pg17-staging.smoke.mjs
