name: Monitor Infraestrutura (isolado)

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'infra/**'
      - '.github/workflows/infra-monitor-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Testes do monitor sem dependencias externas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node nativo
        run: |
          node --version
          node --check admin/app.js
          node --check admin/infra-monitor.js
          node --test admin/tests/infra-monitor.test.mjs
      - name: Testar bloqueio de acesso anonimo na Edge Function
        run: |
          node --input-type=module -e '
            const url = "https://icrtewhazpfauuroswri.supabase.co/functions/v1/lacrose-admin-infra-monitor";
            const response = await fetch(url, {signal: AbortSignal.timeout(10000)});
            if (![401,403].includes(response.status)) {
              throw new Error("Endpoint nao bloqueou acesso anonimo: HTTP " + response.status);
            }
            console.log("Acesso anonimo negado: HTTP", response.status);
          '
